aid: equip-health
name: Equip Health
description: >-
  Equip Health is a virtual, evidence-based eating disorder treatment provider
  founded in 2019 by Kristina Saffran and Erin Parks. Equip delivers 100% remote,
  insurance-covered care for all eating disorder diagnoses — anorexia, bulimia,
  binge eating disorder (BED), ARFID, atypical anorexia, and OSFED — using
  Family-Based Treatment (FBT) and other evidence-based approaches. Every patient
  is matched with a five-person care team: a therapist, medical provider,
  dietitian, family mentor, and peer mentor. Equip serves patients across the
  United States with no waitlist, publishes an extensive library of clinical and
  recovery articles, partners with providers and health plans, and operates a
  patient portal at my.equip.health. This profile catalogs Equip's public web,
  legal, security, and content surfaces; Equip publishes no public developer API,
  SDK, or documentation program at this time.
